basePath: /
definitions:
  auth.ChangePasswordPayload:
    properties:
      confirm_password:
        maxLength: 72
        minLength: 8
        type: string
      current_password:
        minLength: 1
        type: string
      new_password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - confirm_password
    - current_password
    - new_password
    type: object
  auth.LoginPayload:
    properties:
      email:
        type: string
      password:
        minLength: 1
        type: string
    required:
    - email
    - password
    type: object
  auth.UpdateProfilePayload:
    properties:
      email:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - email
    - name
    type: object
  health_catalog.CreateHealthCatalogPayload:
    properties:
      category:
        enum:
        - vaccine
        - deworming
        - exam
        type: string
      description:
        maxLength: 1000
        type: string
      frequency_months:
        maximum: 120
        minimum: 1
        type: integer
      is_mandatory:
        type: boolean
      name:
        maxLength: 100
        minLength: 1
        type: string
      species:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - category
    - name
    - species
    type: object
  health_catalog.UpdateHealthCatalogPayload:
    properties:
      category:
        enum:
        - vaccine
        - deworming
        - exam
        type: string
      description:
        maxLength: 1000
        type: string
      frequency_months:
        maximum: 120
        minimum: 1
        type: integer
      is_mandatory:
        type: boolean
      name:
        maxLength: 100
        minLength: 1
        type: string
      species:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - category
    - name
    - species
    type: object
  pet.CreatePetPayload:
    properties:
      birth_date:
        type: string
      birth_date_exact:
        type: boolean
      breed:
        maxLength: 100
        type: string
      life_stage:
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
      size:
        type: string
      species:
        enum:
        - dog
        - cat
        - bird
        - rabbit
        - fish
        - other
        type: string
      weight_grams:
        minimum: 1
        type: integer
    required:
    - birth_date
    - name
    - species
    type: object
  pet.UpdatePetPayload:
    properties:
      birth_date:
        type: string
      birth_date_exact:
        type: boolean
      breed:
        maxLength: 100
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
      size:
        type: string
    required:
    - birth_date
    - name
    type: object
  setup.SetupPayload:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  user.CreateUserPayload:
    properties:
      email:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      pet_limit:
        minimum: 0
        type: integer
    required:
    - email
    - name
    - password
    type: object
  user.UpdateUserPayload:
    properties:
      email:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      pet_limit:
        minimum: 0
        type: integer
    required:
    - email
    - name
    type: object
host: localhost:8080
info:
  contact: {}
  description: API REST para gestión de mascotas y usuarios.
  title: My Pets API
  version: "1.0"
paths:
  /api/v1/auth/google:
    get:
      responses:
        "302":
          description: Redirect to Google
      summary: Initiate Google OAuth login
      tags:
      - auth
  /api/v1/auth/google/callback:
    get:
      responses:
        "302":
          description: Redirect to frontend
        "400":
          description: invalid state or code
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Google OAuth callback
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credenciales de acceso
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/auth.LoginPayload'
      produces:
      - application/json
      responses:
        "200":
          description: 'data: User'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: error de validación
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: credenciales inválidas
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Iniciar sesión con email y contraseña
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: 'message: logged out'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: autenticación requerida
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Cerrar sesión — limpia las cookies de autenticación
      tags:
      - auth
  /api/v1/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: 'data: User'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: no autorizado
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Obtener el usuario actualmente autenticado
      tags:
      - auth
  /api/v1/auth/password:
    put:
      consumes:
      - application/json
      parameters:
      - description: Datos de cambio de contraseña
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/auth.ChangePasswordPayload'
      produces:
      - application/json
      responses:
        "200":
          description: 'message: password updated'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: error de validación o proveedor incorrecto
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: no autorizado o contraseña actual incorrecta
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Cambiar la contraseña del usuario autenticado
      tags:
      - auth
  /api/v1/auth/profile:
    put:
      consumes:
      - application/json
      parameters:
      - description: Datos a actualizar
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/auth.UpdateProfilePayload'
      produces:
      - application/json
      responses:
        "200":
          description: 'data: User'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: error de validación
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: no autorizado
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: email ya en uso
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Actualizar nombre y email del usuario autenticado
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: 'data: User'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: token de refresh inválido o expirado
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Renovar token de acceso usando la cookie de refresh
      tags:
      - auth
  /api/v1/health-catalogs:
    get:
      parameters:
      - description: Número de página (por defecto 1)
        in: query
        name: page
        type: integer
      - description: Elementos por página (por defecto 10)
        in: query
        name: per_page
        type: integer
      - description: Filtrar por especie (dog, cat, bird, rabbit, fish, other)
        in: query
        name: species
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'data: []HealthCatalog, total: int, page: int, per_page: int,
            total_pages: int'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: autenticación requerida
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: mensaje de error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Listar registros de la guía de salud (paginado)
      tags:
      - health-catalogs
    post:
      consumes:
      - application/json
      parameters:
      - description: Datos del registro
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/health_catalog.CreateHealthCatalogPayload'
      produces:
