          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: autenticación requerida
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: prohibido
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: registro no encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: mensaje de error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Eliminar un registro de la guía de salud (solo usuario sistema)
      tags:
      - health-catalogs
    get:
      parameters:
      - description: ID del registro
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'data: HealthCatalog'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: id inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: autenticación requerida
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: registro no encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: mensaje de error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Obtener un registro de la guía de salud por ID
      tags:
      - health-catalogs
    put:
      consumes:
      - application/json
      parameters:
      - description: ID del registro
        in: path
        name: id
        required: true
        type: string
      - description: Datos del registro
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/health_catalog.UpdateHealthCatalogPayload'
      produces:
      - application/json
      responses:
        "200":
          description: 'data: HealthCatalog'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: id inválido o error de validación
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: autenticación requerida
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: prohibido
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: registro no encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: mensaje de error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Actualizar un registro de la guía de salud (solo usuario sistema)
      tags:
      - health-catalogs
  /api/v1/health-catalogs/species/{species}:
    get:
      parameters:
      - description: Especie (dog, cat, bird, rabbit, fish, other)
        in: path
