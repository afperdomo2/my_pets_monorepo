basePath: /
definitions:
  auth.ChangePasswordPayload:
    properties:
      confirm_password:
        maxLength: 72
        minLength: 8
        type: string
      current_password:
        minLength: 1
        type: string
      new_password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - confirm_password
    - current_password
    - new_password
    type: object
  auth.LoginPayload:
    properties:
      email:
        type: string
      password:
        minLength: 1
        type: string
    required:
    - email
    - password
    type: object
  auth.UpdateProfilePayload:
    properties:
      email:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - email
    - name
    type: object
  exam.CompletePayload:
    properties:
      completed_date:
        type: string
      results:
        items:
          $ref: '#/definitions/exam.ResultPayload'
        type: array
    required:
    - completed_date
    type: object
  exam.CreatePayload:
    properties:
      completed_date:
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
      notes:
        maxLength: 1000
        type: string
      pet_id:
        type: string
      reason:
        maxLength: 1000
        type: string
      results:
        items:
          $ref: '#/definitions/exam.ResultPayload'
        type: array
      scheduled_date:
        type: string
      status:
        enum:
        - scheduled
        - completed
        type: string
    required:
    - name
    - pet_id
    type: object
  exam.ResultPayload:
    properties:
      parameter_name:
        maxLength: 100
        minLength: 1
        type: string
      unit:
        maxLength: 50
        type: string
      value:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - parameter_name
    - value
    type: object
  exam.SchedulePayload:
    properties:
      scheduled_date:
        type: string
    required:
    - scheduled_date
    type: object
  exam.UpdatePayload:
    properties:
      name:
        maxLength: 100
        minLength: 1
        type: string
      notes:
        maxLength: 1000
        type: string
      reason:
        maxLength: 1000
        type: string
      scheduled_date:
        type: string
    type: object
  health_catalog.CreateHealthCatalogPayload:
    properties:
      category:
        enum:
        - vaccine
        - deworming
        - exam
        type: string
      description:
        maxLength: 1000
        type: string
      frequency_months:
        maximum: 120
        minimum: 1
        type: integer
      is_mandatory:
        type: boolean
      name:
        maxLength: 100
        minLength: 1
        type: string
      species:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - category
    - name
    - species
    type: object
  health_catalog.UpdateHealthCatalogPayload:
    properties:
      category:
        enum:
        - vaccine
        - deworming
        - exam
        type: string
      description:
        maxLength: 1000
        type: string
      frequency_months:
        maximum: 120
        minimum: 1
        type: integer
      is_mandatory:
        type: boolean
      name:
        maxLength: 100
        minLength: 1
        type: string
      species:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - category
    - name
    - species
    type: object
  health_record.CreateHealthRecordPayload:
    properties:
      application_date:
        type: string
      category:
        enum:
        - vaccine
        - deworming
        type: string
      health_catalog_id:
        type: string
      name:
        maxLength: 100
        type: string
      next_dose_date:
        type: string
      notes:
        maxLength: 1000
        type: string
      pet_id:
        type: string
      total_doses:
        minimum: 1
        type: integer
    required:
    - application_date
    - pet_id
    type: object
  health_record.UpdateHealthRecordPayload:
    properties:
      application_date:
        type: string
      category:
        enum:
        - vaccine
        - deworming
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
      next_dose_date:
        type: string
      notes:
        maxLength: 1000
        type: string
      total_doses:
        minimum: 1
        type: integer
    required:
    - category
    - name
    type: object
  pet.CreatePetPayload:
    properties:
      birth_date:
        type: string
      birth_date_exact:
        type: boolean
      breed:
        maxLength: 100
        type: string
      life_stage:
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
      size:
        type: string
      species:
        enum:
        - dog
        - cat
        - bird
        - rabbit
        - fish
        - other
        type: string
      weight_grams:
        minimum: 1
        type: integer
    required:
    - birth_date
    - name
    - species
    type: object
  pet.UpdatePetPayload:
    properties:
      birth_date:
        type: string
      birth_date_exact:
        type: boolean
      breed:
        maxLength: 100
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
      size:
        type: string
    required:
    - birth_date
    - name
    type: object
  setup.SetupPayload:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  user.CreateUserPayload:
    properties:
      email:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      pet_limit:
        minimum: 0
        type: integer
    required:
    - email
    - name
    - password
    type: object
  user.UpdateUserPayload:
    properties:
      email:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      pet_limit:
        minimum: 0
        type: integer
    required:
    - email
    - name
    type: object
  vaccine_application.CreatePayload:
    properties:
      application_date:
        type: string
      health_record_id:
        type: string
      next_dose_date:
        type: string
      notes:
        maxLength: 1000
        type: string
    required:
    - application_date
    - health_record_id
    type: object
  vaccine_application.UpdatePayload:
    properties:
      application_date:
        type: string
      notes:
        maxLength: 1000
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API REST para gestión de mascotas y usuarios.
  title: My Pets API
  version: "1.0"
paths:
  /api/v1/auth/google:
    get:
      description: Inicia el flujo de autenticación OAuth con Google. Redirige a la
        pantalla de consentimiento de Google.
      responses:
        "302":
          description: Redirect to Google
      summary: Iniciar autenticación con Google
      tags:
      - auth
  /api/v1/auth/google/callback:
    get:
      description: Procesa el callback de Google OAuth, intercambia el código por
        tokens y redirige al frontend.
      responses:
        "302":
          description: Redirect to frontend
        "400":
          description: invalid state or code
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Callback de autenticación con Google
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Autentica al usuario con email y contraseña, y establece cookies
        de acceso y refresh.
      parameters:
      - description: Credenciales de acceso
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/auth.LoginPayload'
      produces:
      - application/json
      responses:
        "200":
          description: 'data: User'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: error de validación
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: credenciales inválidas
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Iniciar sesión con email y contraseña
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      description: Cierra la sesión eliminando las cookies de autenticación.
      produces:
      - application/json
      responses:
        "200":
          description: 'message: logged out'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: autenticación requerida
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Cerrar sesión — limpia las cookies de autenticación
      tags:
      - auth
  /api/v1/auth/me:
    get:
      description: Obtiene los datos del usuario autenticado mediante las cookies
        de sesión.
      produces:
      - application/json
      responses:
        "200":
          description: 'data: User'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: no autorizado
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Obtener el usuario actualmente autenticado
      tags:
      - auth
  /api/v1/auth/password:
    put:
      consumes:
      - application/json
      description: Cambia la contraseña del usuario autenticado. Requiere la contraseña
        actual.
      parameters:
      - description: Datos de cambio de contraseña
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/auth.ChangePasswordPayload'
      produces:
      - application/json
      responses:
        "200":
          description: 'message: password updated'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: error de validación o proveedor incorrecto
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: no autorizado o contraseña actual incorrecta
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Cambiar la contraseña del usuario autenticado
      tags:
      - auth
  /api/v1/auth/profile:
    put:
      consumes:
      - application/json
      description: Actualiza el nombre y email del usuario autenticado. Valida que
        el email no esté en uso.
      parameters:
      - description: Datos a actualizar
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/auth.UpdateProfilePayload'
      produces:
      - application/json
      responses:
        "200":
          description: 'data: User'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: error de validación
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: no autorizado
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: email ya en uso
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Actualizar nombre y email del usuario autenticado
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      description: Renueva el token de acceso usando la cookie de refresh token.
      produces:
      - application/json
      responses:
        "200":
          description: 'data: User'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: token de refresh inválido o expirado
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Renovar token de acceso usando la cookie de refresh
      tags:
      - auth
  /api/v1/dashboard/summary:
    get:
      description: Obtiene un resumen de los principales indicadores del dashboard
        del usuario autenticado.
      produces:
      - application/json
      responses:
        "200":
          description: 'data: DashboardSummary'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: autenticación requerida
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: mensaje de error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Obtener resumen del dashboard
      tags:
      - dashboard
  /api/v1/exams:
    get:
      description: Obtiene todos los exámenes del usuario autenticado con paginación.
      parameters:
      - description: Número de página (por defecto 1)
        in: query
        name: page
        type: integer
      - description: Elementos por página (por defecto 10)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 'data: []Exam, total: int, page: int, per_page: int, total_pages:
            int'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: autenticación requerida
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: mensaje de error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Listar todos los exámenes del usuario (paginado)
      tags:
      - exams
    post:
      consumes:
      - application/json
      description: Crea un nuevo examen veterinario.
      parameters:
      - description: Datos del examen
        in: body
        name: exam
        required: true
        schema:
          $ref: '#/definitions/exam.CreatePayload'
      produces:
      - application/json
      responses:
        "201":
          description: 'data: Exam'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: error de validación
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: autenticación requerida
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: mascota no encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: mensaje de error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Crear un examen
      tags:
      - exams
  /api/v1/exams/{id}:
    delete:
      description: Elimina un examen del sistema.
      parameters:
      - description: ID del examen
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'message: examen eliminado'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: id inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: autenticación requerida
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: examen no encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: mensaje de error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Eliminar un examen
      tags:
      - exams
    get:
      description: Obtiene un examen específico con sus resultados.
      parameters:
      - description: ID del examen
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'data: Exam, results: []ExamResult'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: id inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: autenticación requerida
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: examen no encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: mensaje de error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Obtener examen por ID con resultados
      tags:
      - exams
    put:
      consumes:
      - application/json
      description: Actualiza los datos de un examen existente.
      parameters:
      - description: ID del examen
        in: path
        name: id
        required: true
        type: string
      - description: Datos del examen
        in: body
        name: exam
        required: true
        schema:
          $ref: '#/definitions/exam.UpdatePayload'
      produces:
      - application/json
      responses:
        "200":
          description: 'data: Exam'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: error de validación
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: autenticación requerida
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: examen no encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: mensaje de error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Actualizar un examen
      tags:
      - exams
  /api/v1/exams/{id}/complete:
    patch:
      consumes:
      - application/json
      description: Marca un examen como completado y opcionalmente agrega resultados.
      parameters:
      - description: ID del examen
        in: path
        name: id
        required: true
        type: string
      - description: Fecha de completado y resultados
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/exam.CompletePayload'
      produces:
      - application/json
      responses:
        "200":
          description: 'data: Exam'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: error de validación
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: autenticación requerida
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: examen no encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: mensaje de error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Completar un examen
      tags:
      - exams
  /api/v1/exams/{id}/schedule:
    patch:
      consumes:
      - application/json
      description: Programa o reprograma la fecha de un examen.
      parameters:
      - description: ID del examen
        in: path
        name: id
        required: true
        type: string
      - description: Fecha programada
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/exam.SchedulePayload'
      produces:
      - application/json
      responses:
        "200":
          description: 'data: Exam'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: error de validación
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: autenticación requerida
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: examen no encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: mensaje de error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Programar un examen
      tags:
      - exams
  /api/v1/exams/pets/{pet_id}:
    get:
      description: Obtiene los exámenes de una mascota específica con paginación.
      parameters:
      - description: ID de la mascota
        in: path
        name: pet_id
        required: true
        type: string
      - description: Número de página (por defecto 1)
        in: query
        name: page
        type: integer
      - description: Elementos por página (por defecto 10)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 'data: []Exam, total: int, page: int, per_page: int, total_pages:
            int'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: pet_id inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: autenticación requerida
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: mensaje de error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Listar exámenes de una mascota (paginado)
      tags:
      - exams
  /api/v1/health-catalogs:
    post:
      consumes:
      - application/json
      description: Crea un nuevo registro en la guía de salud. Solo accesible por
        usuarios sistema.
      parameters:
      - description: Datos del registro
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/health_catalog.CreateHealthCatalogPayload'
      produces:
      - application/json
      responses:
        "201":
          description: 'data: HealthCatalog'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: error de validación
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: autenticación requerida
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: prohibido
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: mensaje de error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Crear un nuevo registro en la guía de salud (solo usuario sistema)
      tags:
      - health-catalogs
  /api/v1/health-catalogs/{id}:
    delete:
      description: Elimina un registro de la guía de salud. Solo accesible por usuarios
        sistema.
      parameters:
      - description: ID del registro
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'message: health catalog deleted'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: id inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: autenticación requerida
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: prohibido
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: registro no encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: mensaje de error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Eliminar un registro de la guía de salud (solo usuario sistema)
      tags:
      - health-catalogs
    get:
      description: Obtiene un registro específico de la guía de salud por su ID.
      parameters:
      - description: ID del registro
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'data: HealthCatalog'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: id inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: autenticación requerida
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: registro no encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: mensaje de error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
