basePath: /
definitions:
  auth.LoginPayload:
    properties:
      email:
        type: string
      password:
        minLength: 1
        type: string
    required:
    - email
    - password
    type: object
  pet.PetPayload:
    properties:
      age:
        maximum: 100
        minimum: 0
        type: integer
      breed:
        maxLength: 100
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
      owner:
        maxLength: 100
        type: string
      species:
        enum:
        - dog
        - cat
        - bird
        - rabbit
        - fish
        - other
        type: string
    required:
    - name
    - species
    type: object
  setup.SetupPayload:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  user.CreateUserPayload:
    properties:
      email:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  user.UpdateUserPayload:
    properties:
      email:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - email
    - name
    type: object
host: localhost:8080
info:
  contact: {}
  description: API REST para gestión de mascotas y usuarios.
  title: My Pets API
  version: "1.0"
paths:
  /api/v1/auth/google:
    get:
      responses:
        "302":
          description: Redirect to Google
      summary: Initiate Google OAuth login
      tags:
      - auth
  /api/v1/auth/google/callback:
    get:
      responses:
        "302":
          description: Redirect to frontend
        "400":
          description: invalid state or code
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Google OAuth callback
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/auth.LoginPayload'
      produces:
      - application/json
      responses:
        "200":
          description: 'data: User'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: invalid credentials
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login with email and password
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: 'message: logged out'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: authentication required
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Logout — clears auth cookies
      tags:
      - auth
  /api/v1/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: 'data: User'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Get the currently authenticated user
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: 'data: User'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: invalid or expired refresh token
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh access token using the refresh cookie
      tags:
      - auth
  /api/v1/pets:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: 'data: []Pet, total: int'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: authentication required
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error message
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: List all pets
      tags:
      - pets
    post:
      consumes:
      - application/json
      parameters:
      - description: Pet data
        in: body
        name: pet
        required: true
        schema:
          $ref: '#/definitions/pet.PetPayload'
      produces:
      - application/json
      responses:
        "201":
          description: 'data: Pet'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: authentication required
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error message
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Create a new pet
      tags:
      - pets
  /api/v1/pets/{id}:
    delete:
      parameters:
      - description: Pet ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 'message: pet deleted'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: invalid id
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: authentication required
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: pet not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error message
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Delete a pet
      tags:
      - pets
    get:
      parameters:
      - description: Pet ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 'data: Pet'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid id
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: authentication required
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: pet not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error message
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Get a pet by ID
      tags:
      - pets
    put:
      consumes:
      - application/json
      parameters:
      - description: Pet ID
        in: path
        name: id
        required: true
        type: integer
      - description: Pet data
        in: body
        name: pet
        required: true
        schema:
          $ref: '#/definitions/pet.PetPayload'
      produces:
      - application/json
      responses:
        "200":
          description: 'data: Pet'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid id or validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: authentication required
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: pet not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error message
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Update an existing pet
      tags:
      - pets
  /api/v1/setup:
    post:
      consumes:
      - application/json
      parameters:
      - description: First user data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/setup.SetupPayload'
      produces:
      - application/json
      responses:
        "201":
          description: 'data: User'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: system already initialized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error message
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create the first system user
      tags:
      - setup
  /api/v1/setup/status:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: 'needs_setup: true if no users exist'
          schema:
            additionalProperties:
              type: boolean
            type: object
      summary: Check setup status
      tags:
      - setup
  /api/v1/users:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: 'data: []User, total: int'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: authentication required
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error message
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: List all users (system user only)
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Only a user with is_system_user=true may call this endpoint.
      parameters:
      - description: User data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/user.CreateUserPayload'
      produces:
      - application/json
      responses:
        "201":
          description: 'data: User'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: authentication required
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: email already in use
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error message
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Create a new user (system user only)
      tags:
      - users
  /api/v1/users/{id}:
    delete:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 'message: user deleted'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: invalid id
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: authentication required
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: user not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error message
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Delete a user
      tags:
      - users
    get:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 'data: User'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid id
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: authentication required
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: user not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error message
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Get a user by ID (system user only)
      tags:
      - users
    put:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: User data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/user.UpdateUserPayload'
      produces:
      - application/json
      responses:
        "200":
          description: 'data: User'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid id or validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: authentication required
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: user not found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: email already in use
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error message
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Update an existing user
      tags:
      - users
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: ok
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - health
securityDefinitions:
  CookieAuth:
    description: Cookie HttpOnly de sesión. Obtenida al hacer login o refresh. Se
      envía automáticamente por el navegador.
    in: cookie
    name: access_token
    type: apiKey
swagger: "2.0"
tags:
- description: Liveness check
  name: health
- description: Operaciones sobre mascotas
  name: pets
- description: Operaciones sobre usuarios
  name: users
