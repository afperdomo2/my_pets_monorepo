name: Backend CI

on:
  push:
    branches: [main, develop]
    paths: ["apps/api/**"]
  pull_request:
    paths: ["apps/api/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/api/go.sum

      - name: Lint
        run: go vet ./...

      - name: Test (handler + unit)
        run: go test ./... -count=1
